<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Veille — alien veilleur</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.55" stop-color="#1e0b4a"/>
      <stop offset="1" stop-color="#08041c"/>
    </radialGradient>
    <linearGradient id="alien" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b8a"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <g fill="#ffffff">
    <circle cx="60" cy="80" r="2.5"/>
    <circle cx="100" cy="40" r="1.5" opacity="0.7"/>
    <circle cx="170" cy="60" r="1" opacity="0.5"/>
    <circle cx="240" cy="40" r="1.5" opacity="0.6"/>
    <circle cx="310" cy="70" r="1" opacity="0.4"/>
    <circle cx="380" cy="40" r="2" opacity="0.8"/>
    <circle cx="430" cy="80" r="1.5" opacity="0.7"/>
    <circle cx="460" cy="130" r="1" opacity="0.5"/>
    <circle cx="40" cy="180" r="1.5" opacity="0.6"/>
    <circle cx="470" cy="220" r="1.5" opacity="0.7"/>
    <circle cx="40" cy="380" r="2" opacity="0.7"/>
    <circle cx="80" cy="450" r="1.5" opacity="0.6"/>
    <circle cx="120" cy="470" r="1" opacity="0.4"/>
    <circle cx="180" cy="460" r="1.5" opacity="0.6"/>
    <circle cx="290" cy="465" r="1" opacity="0.4"/>
    <circle cx="380" cy="450" r="1.5" opacity="0.6"/>
    <circle cx="440" cy="430" r="2" opacity="0.8"/>
    <circle cx="470" cy="380" r="1.5" opacity="0.6"/>
  </g>

  <g fill="url(#alien)" filter="url(#glow)">
    <rect x="160" y="128" width="48" height="48"/>
    <rect x="304" y="128" width="48" height="48"/>
    <rect x="160" y="176" width="48" height="48"/>
    <rect x="304" y="176" width="48" height="48"/>
    <rect x="112" y="176" width="288" height="48"/>
    <rect x="64" y="224" width="384" height="48"/>
    <rect x="64" y="272" width="96" height="48"/>
    <rect x="208" y="272" width="96" height="48"/>
    <rect x="352" y="272" width="96" height="48"/>
    <rect x="64" y="320" width="384" height="48"/>
    <rect x="112" y="368" width="48" height="48"/>
    <rect x="208" y="368" width="48" height="48"/>
    <rect x="304" y="368" width="48" height="48"/>
    <rect x="352" y="368" width="48" height="48"/>
    <rect x="64" y="416" width="48" height="48"/>
    <rect x="160" y="416" width="48" height="48"/>
    <rect x="304" y="416" width="48" height="48"/>
    <rect x="400" y="416" width="48" height="48"/>
  </g>

  <g>
    <rect x="208" y="272" width="48" height="48" fill="#ffffff"/>
    <rect x="256" y="272" width="48" height="48" fill="#ffffff"/>
    <rect x="232" y="272" width="24" height="24" fill="#08041c"/>
    <rect x="280" y="272" width="24" height="24" fill="#08041c"/>
  </g>

  <g filter="url(#softglow)">
    <rect x="40" y="488" width="120" height="3" fill="#22d3a8" opacity="0.95"/>
